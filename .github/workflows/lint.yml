name: Lint

on:
  push:
  pull_request:

# Cancel superseded runs of the same branch / PR, except on main
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install tox
        run: |
          uv tool install tox --with tox-uv
      - name: Run ruff
        # Same constraint as the dev extra in pyproject.toml
        run: uvx "ruff>=0.17.1,<0.18.0" check --output-format=github .
      - name: Run codespell
        run: tox -e codespell
