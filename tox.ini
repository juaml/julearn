[tox]
requires =
    tox>=4
env_list =
    ruff,
    changelog,
    test,
    coverage,
    codespell,
    py3{12,13,14},
    nodeps,
    mindeps
isolated_build = true

[gh-actions]
python =
    3.12: py312, nodeps
    3.13: coverage
    3.14: py314

[testenv]
skip_install = false
deps =
    pytest
    pytest-xdist
    seaborn
    scikit-optimize>=0.10.2,<0.11
    optuna>=4.0.0,<6.0.0
    optuna-integration>=4.0.0,<6.0.0
    xgboost>=3.0.0,<4.0.0
# The number of pytest-xdist workers can be set with PYTEST_XDIST_WORKERS
# (0 disables pytest-xdist, as done in CI)
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:auto} {toxinidir}/julearn {posargs}

[testenv:ruff]
description = run ruff
skip_install = true
deps =
    ruff>=0.1.0
commands =
    ruff format {toxinidir}
    ruff check {toxinidir}

[testenv:changelog]
description = show changelog
skip_install = true
# See https://github.com/sphinx-contrib/sphinxcontrib-towncrier/issues/92
# Pin also present in pyproject.toml
deps =
    towncrier>=25.8.0
    lazy_loader==0.4
commands =
    towncrier build --draft

[testenv:test]
description = run tests
skip_install = false
deps =
    pytest
    pytest-xdist
    seaborn
    panel>=1.4.5
    bokeh>=3.4.3
    param
    scikit-optimize>=0.10.2,<0.11
    optuna>=4.0.0,<6.0.0
    optuna-integration>=4.0.0,<6.0.0
    xgboost>=3.0.0,<4.0.0
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:auto} -vv {toxinidir}/julearn {posargs}

[testenv:nodeps]
description = run tests with nodeps filter
skip_install = false
deps =
    pytest
    pytest-xdist
    seaborn
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:auto} -vv --filter=nodeps {toxinidir}/julearn {posargs}

[testenv:mindeps]
description = run tests with the minimum supported dependency versions
# Install the lowest versions allowed in pyproject.toml for julearn's direct
# dependencies (with tox-uv). julearn is installed as editable together with
# the test tools in a single resolution, so uv considers its requirements as
# direct ones. The test tools need lower bounds, as they would be installed at
# their lowest versions too.
skip_install = true
uv_resolution = lowest-direct
deps =
    -e .[skopt,optuna,xgboost]
    pytest>=8.0.0
    pytest-xdist>=3.0.0
    seaborn>=0.13.0
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:auto} -vv {toxinidir}/julearn {posargs}

[testenv:coverage]
description = run tests with coverage
skip_install = false
deps =
    pytest
    pytest-cov
    pytest-xdist
    seaborn
    panel>=1.4.5
    bokeh>=3.4.3
    param>=2.2.1
    scikit-optimize>=0.10.2,<0.11
    optuna>=4.0.0,<6.0.0
    optuna-integration>=4.0.0,<6.0.0
    xgboost>=3.0.0,<4.0.0
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:auto} --cov={envsitepackagesdir}/julearn --cov=./julearn --cov-report=xml --cov-report=term --cov-config=pyproject.toml -vv {posargs}

[testenv:codespell]
description = run codespell
skip_install = true
deps =
    codespell
    tomli
commands =
    codespell --toml {toxinidir}/pyproject.toml {toxinidir}/docs/ {toxinidir}/examples/ {toxinidir}/julearn/ {toxinidir}/README.md
